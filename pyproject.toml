[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpair-mic"
version = "0.1.0"
description = "Fast Pair Bluetooth audio application"
requires-python = ">=3.11"
dependencies = [
    "bleak",
    "cryptography",
    "dbus-next",
    "numpy",
    "sounddevice",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

