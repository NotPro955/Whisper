[package]
name = "whisperpair"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "whisperpair"
path = "src/main.rs"

[[bin]]
name = "whisperpair-tui"
path = "src/tui_main.rs"

[dependencies]
bluer = { version = "0.16", features = ["full"] }
tokio = { version = "1", features = ["full"] }
aes = "=0.8.4"
hex = "=0.4.3"
rand = "=0.8.5"
clap = { version = "=3.2.25", features = ["derive"] }
p256 = { version = "=0.13.2", features = ["ecdh"] }
sha2 = "=0.10.8"
anyhow = "=1.0.86"
futures = "=0.3.30"
uuid = { version = "=1.10.0", features = ["v4"] }
bitflags = "=2.6.0"
zeroize = "=1.7.0"
base64ct = "=1.6.0"
ratatui = "=0.25.0"
crossterm = "=0.27.0"
tokio-util = { version = "=0.7.11", features = ["full"] }
unicode-segmentation = "=1.10.1"
